distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# -bin, not -all. The -all distribution ships Gradle's own sources and
# javadoc, which only serve IDE completion while editing build scripts and are
# never read during a build — 768MB unpacked here against roughly a third for
# -bin.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
