name: pipstats_landing
description: PipStats landing page for Cloudflare Pages deployment
publish_to: none
version: 1.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: VT323
      fonts:
        - asset: ../../assets/fonts/VT323-Regular.ttf